<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Autos Colombia</title>

<!-- path to the CSS -->
<link rel="stylesheet" href="../CSS/login.css">

</head>

<body>

<div class="login-container">

    <h2>Autos Colombia</h2>
    <p>Sign in</p>

    <form id="loginForm" data-testid="login-form">

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" data-testid="login-username-input" placeholder="Valid username: admin">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" data-testid="login-password-input" placeholder="Valid password: 12345">
        </div>

        <button type="submit" class="btn-login" data-testid="login-submit-button">Sign In</button>

        <p id="errorMessage" class="error" data-testid="login-error-message"></p>

    </form>

</div>

<!-- path to the JS -->
<script src="../JS/login.js"></script>

</body>
</html>
